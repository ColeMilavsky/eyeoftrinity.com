<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Trinity Davis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #4d1724;
      --surface:  #d1a1a8;
      --border:   #8c3b47;
      --text:     #f8b7c3d2;
      --muted:    #5a2b32;
      --accent:   #5d1425;
      --accent2:  #eebecac5;
      --black:    #250d12;
      --white:    #f2f5f0;
      --serif:    'Cormorant Garamond', Georgia, serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-weight: 300;
      line-height: 1.6;
      cursor: none;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #cursor {
      position: fixed; top: 0; left: 0; z-index: 9999;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1px solid var(--white);
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: 0.5;
      transition: width 0.3s, height 0.3s, opacity 0.2s;
    }
    body:hover #cursor { opacity: 1; }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.4s, background 0.4s;
    }
    nav.scrolled {
      border-color: var(--border);
      background: var(--accent);
      backdrop-filter: blur(12px);
    }
    .nav-logo {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: var(--serif);
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.current { color: var(--text); }
    #contact {
      padding: 6rem 3rem 8rem;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0rem;
      align-items: center;
      border-top: 1px solid var(--border);
      position: relative; z-index: 1;
      margin-top: 0rem;
      flex: 1;
    }
    .contact-heading {
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 300;
      line-height: 1.1;
    }
    .contact-heading em { font-style: italic; color: var(--text); }
    .contact-links { display: flex; flex-direction: column; gap: 1rem; }
    .contact-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: color 0.2s;
    }
    .contact-row:hover { color: var(--text); }
    .contact-row-label {
      font-family: var(--serif);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .contact-row-value {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
    }
    .contact-arrow { opacity: 0.4; font-size: 0.8rem; transition: transform 0.2s, opacity 0.2s; }
    .contact-row:hover .contact-arrow { transform: translateX(4px); opacity: 1; }
    footer {
      padding: 2rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border);
      position: relative; z-index: 1;
    }
    .footer-copy {
      font-family: var(--serif);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--text);
    }
    .footer-back {
      font-family: var(--serif);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-back:hover { color: var(--text); }
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s, transform 0.7s cubic-bezier(0.22,1,0.36,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 900px) {
      nav { padding: 1.2rem 1.5rem; }
      #contact { grid-template-columns: 1fr; padding: 4rem 1.5rem; }
      footer { padding: 1.5rem; flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="cursor"></div>

  <nav id="nav">
    <a href="index.html" class="nav-logo">Trinity Davis</a>
    <ul class="nav-links">
      <li><a href="work.html">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="current">Contact</a></li>
    </ul>
  </nav>

  <section id="contact" class="reveal">
    <div>
      <h2 class="contact-heading">Let's work <em>together.</em></h2>
    </div>
    <div class="contact-links">
      <a href="mailto:eyeoftrinityy@email.com" class="contact-row">
        <span class="contact-row-label">Email</span>
        <span class="contact-row-value">eyeoftrinityy@email.com</span>
        <span class="contact-arrow">→</span>
      </a>
      <a href="https://www.instagram.com/eyeoftrinity_" class="contact-row" target="_blank" rel="noopener">
        <span class="contact-row-label">Instagram</span>
        <span class="contact-row-value">@eyeoftrinity_</span>
        <span class="contact-arrow">→</span>
      </a>
      <a href="https://www.linkedin.com/in/eyeoftrinity/" class="contact-row" target="_blank" rel="noopener">
        <span class="contact-row-label">LinkedIn</span>
        <span class="contact-row-value">www.linkedin.com/in/eyeoftrinity/</span>
        <span class="contact-arrow">→</span>
      </a>
      <a href="#" class="contact-row" target="_blank" rel="noopener">
        <span class="contact-row-label">Résumé / CV</span>
        <span class="contact-row-value">Download PDF</span>
        <span class="contact-arrow">→</span>
      </a>
    </div>
  </section>

  <footer>
    <p class="footer-copy">© 2026 Trinity Davis — All rights reserved</p>
    <a href="index.html" class="footer-back">↑ Back to index</a>
  </footer>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    });
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
