<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Trinity Davis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #4d1724;
      --surface:  #d1a1a8;
      --border:   #8c3b47;
      --text:     #f8b7c3d2;
      --muted:    #5a2b32;
      --accent:   #5d1425;
      --accent2:  #eebecac5;
      --black:    #250d12;
      --white:    #f2f5f0;
      --serif:    'Cormorant Garamond', Georgia, serif;
      --mono:     'DM Mono', monospace;
      --sans:     'Helvetica Neue', Helvetica, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-weight: 300;
      line-height: 1.6;
      cursor: none;
      overflow: hidden;
    }
    #cursor {
      position: fixed; top: 0; left: 0; z-index: 9999;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 1px solid var(--white);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), width 0.3s, height 0.3s, opacity 0.2s;
      opacity: 0.5;
    }
    body:hover #cursor { opacity: 1; }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.4s, background 0.4s;
    }
    nav.scrolled {
      border-color: var(--border);
      background: var(--accent);
      backdrop-filter: blur(12px);
    }
    .nav-logo {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-family: var(--serif);
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    section { position: relative; z-index: 1; }
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 3rem;
      gap: 2rem;
      position: relative;
    }
    .hero-left {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }
    .hero-eyebrow {
      font-family: var(--serif);
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.3s forwards;
    }
    .hero-name {
      font-family: var(--serif);
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.01em;
      opacity: 0;
      animation: fadeUp 0.9s 0.5s forwards;
      margin: 0;
    }
    .hero-tagline {
      font-size: 2rem;
      color: var(--text);
      max-width: 45ch;
      opacity: 0;
      animation: fadeUp 0.9s 0.8s forwards;
      margin-top: 2rem;
      text-align: center;
    }
    #hero::before {
      content: '';
      position: absolute;
      top: 10%; left: 55%;
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(106,168,130,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    #hero > * { position: relative; z-index: 1; }
    footer {
      padding: 2rem 3rem;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border);
      position: relative; z-index: 1;
    }
    .footer-copy {
      font-family: var(--serif);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text);
    }
    .footer-back {
      font-family: var(--serif);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-back:hover { color: var(--text); }
    photo {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 900px) {
      nav { padding: 1.2rem 1.5rem; }
      #hero { padding: 6rem 1.5rem 4rem; }
      footer { padding: 1.5rem; flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="cursor"></div>

  <nav id="nav">
    <a href="index.html" class="nav-logo">Trinity Davis</a>
    <ul class="nav-links">
      <li><a href="work.html">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section id="hero">
    <div class="hero-left">
      <p class="hero-eyebrow">Photography · Curation · Visual Storytelling</p>
      <h1 class="hero-name">Trinity Davis</h1>
    </div>
    <p class="hero-tagline">Exploring space</p>
  </section>

  <footer>
    <p class="footer-copy">© 2026 Trinity Davis — All rights reserved</p>
    <a href="#hero" class="footer-back">↑ Back to top</a>
  </footer>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    });
  </script>
</body>
</html>
